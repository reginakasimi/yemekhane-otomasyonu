{% extends "web/base.html" %}
{% block baslik %}Giriş{% endblock %}
{% block icerik %}
  <div class="kart" style="max-width: 420px; margin-inline: auto;">
    <h1>Giriş yap</h1>
    {% if hata %}
      <p class="bildirim bildirim-hata" role="alert">{{ hata }}</p>
    {% endif %}
    <form method="post" action="/giris">
      {% csrf_token %}
      <p>
        <label for="eposta">E-posta</label>
        <input id="eposta" name="eposta" type="email" required autofocus>
      </p>
      <p>
        <label for="sifre">Şifre</label>
        <input id="sifre" name="sifre" type="password" required>
      </p>
      <button class="dugme" type="submit">Giriş</button>
    </form>
  </div>
{% endblock %}
